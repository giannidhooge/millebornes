services:
  app:
    build:
      context: .
      dockerfile: ./ci/php/Dockerfile
    container_name: millesbornes_app
    working_dir: /var/www
    volumes:
      - ./:/var/www:delegated
    networks:
      - millesbornes

  web:
    image: nginx:alpine
    container_name: millesbornes_web
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www
      - ./ci/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - millesbornes

networks:
  millesbornes:
    enable_ipv6: false
